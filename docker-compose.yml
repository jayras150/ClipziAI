version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    # Semua kredensial dibaca dari satu file: backend/.env
    env_file:
      - ./backend/.env
    environment:
      # Override khusus compose: database memakai service `db` di jaringan Docker
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/clipzi
      - DEBUG=true
    volumes:
      - ./backend:/app
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: clipzi
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # Redis lokal OPSIONAL (default memakai Upstash). Aktifkan hanya bila perlu:
  #   docker compose --profile local-redis up -d
  # lalu set REDIS_URL=redis://redis:6379/0
  redis:
    image: redis:7-alpine
    profiles: ["local-redis"]
    ports:
      - "6379:6379"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data: