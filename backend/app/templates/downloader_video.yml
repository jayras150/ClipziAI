name: Downloader Video (fallback runner)

# Workflow ini HANYA dipakai sebagai fallback ketika download di Vast gagal.
# Cookies diambil dari backend (tidak disimpan di repo/secrets workflow ini)
# lalu dihapus setelah job selesai.

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Unique Task ID'
        required: true
        type: string
      video_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      callback_url:
        description: 'Backend Callback URL'
        required: true
        type: string
      job_token:
        description: 'One-time job token (dikirim backend)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: downloader-${{ inputs.task_id }}
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Mask token
        run: echo "::add-mask::${{ inputs.job_token }}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install yt-dlp (pinned) & ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg curl
          python -m pip install --quiet --upgrade "yt-dlp==2026.10.26"

      - name: Ambil konteks (cookies + presigned upload)
        id: ctx
        env:
          JOB_TOKEN: ${{ inputs.job_token }}
          CALLBACK_URL: ${{ inputs.callback_url }}
          # Opsional: pakai host API lain (mis. subdomain DNS-only) bila
          # Cloudflare di depan domain publik masih memblokir runner.
          API_BASE_OVERRIDE: ${{ vars.DOWNLOADER_API_BASE }}
        run: |
          set -euo pipefail
          API_BASE="${API_BASE_OVERRIDE:-${CALLBACK_URL%/api/internal/downloader/callback}}"
          echo "API_BASE=$API_BASE" >> "$GITHUB_ENV"
          python - "$API_BASE" <<'PY'
          import json, os, sys, time, urllib.error, urllib.request
          base = sys.argv[1].rstrip("/")
          token = os.environ["JOB_TOKEN"]
          # PENTING: Cloudflare memblokir User-Agent default urllib
          # ("Python-urllib/3.x") dengan error 1010 -> HTTP 403, jadi UA harus
          # diisi eksplisit. Tanpa ini step ini selalu gagal 403.
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "User-Agent": "ClipziAI-Downloader/1.0",
          }
          body = json.dumps({"job_token": token}).encode()
          data = None
          last_error = ""
          for attempt in range(1, 4):
              req = urllib.request.Request(
                  base + "/api/internal/downloader/context",
                  data=body,
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      data = json.loads(resp.read())
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace").strip()[:300]
                  last_error = f"HTTP {exc.code}: {detail}"
                  # 4xx (selain 408/429) tidak akan membaik bila diulang.
                  if exc.code < 500 and exc.code not in (408, 429):
                      raise SystemExit(f"Gagal ambil konteks -> {last_error}") from exc
              except (urllib.error.URLError, TimeoutError, ValueError) as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
              if attempt < 3:
                  print(f"percobaan {attempt} gagal ({last_error}), ulangi...", flush=True)
                  time.sleep(5 * attempt)
          if data is None:
              raise SystemExit(f"Gagal ambil konteks setelah 3 percobaan -> {last_error}")
          with open("/tmp/ctx.json", "w", encoding="utf-8") as fh:
              json.dump(data, fh)
          cookies = data.get("cookies") or ""
          if cookies:
              with open("/tmp/cookies.txt", "w", encoding="utf-8") as fh:
                  fh.write(cookies)
              os.chmod("/tmp/cookies.txt", 0o600)
          print("cookies_present=", bool(cookies))
          print("upload_ready=", bool(data.get("upload_url")))
          PY

      - name: Validasi cookies
        run: |
          set -euo pipefail
          if [ -s /tmp/cookies.txt ]; then
            if ! grep -q "youtube.com" /tmp/cookies.txt; then
              echo "::error::cookies tidak berisi domain youtube.com"
              exit 1
            fi
            echo "cookies_format=valid"
          else
            echo "cookies_format=absent"
          fi

      - name: Download video
        id: download
        env:
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          set -euo pipefail
          COOKIE_ARGS=()
          if [ -s /tmp/cookies.txt ]; then
            COOKIE_ARGS=(--cookies /tmp/cookies.txt)
          fi
          max_mb=$(python -c "import json;print(json.load(open('/tmp/ctx.json')).get('max_file_mb') or 2048)")
          yt-dlp \
            "${COOKIE_ARGS[@]}" \
            --no-warnings \
            --no-playlist \
            --retries 3 \
            --fragment-retries 3 \
            --format "bv*+ba/b" \
            --merge-output-format mp4 \
            --max-filesize "${max_mb}M" \
            --output "/tmp/source.%(ext)s" \
            "$VIDEO_URL"
          ls -l /tmp/source.*

      - name: Upload ke cloud storage
        id: upload
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, glob
          ctx = json.load(open("/tmp/ctx.json"))
          files = glob.glob("/tmp/source.*")
          if not files:
              raise SystemExit("file hasil download tidak ditemukan")
          path = files[0]
          print("upload_path=", path, "size=", os.path.getsize(path))
          open("/tmp/upload_path.txt", "w").write(path)
          open("/tmp/upload_url.txt", "w").write(ctx["upload_url"])
          PY
          curl -sS --fail -X PUT \
            -H "Content-Type: video/mp4" \
            --upload-file "$(cat /tmp/upload_path.txt)" \
            "$(cat /tmp/upload_url.txt)" \
            -o /tmp/upload_resp.txt -w "upload_http=%{http_code}\n"

      - name: Callback sukses
        if: success()
        env:
          JOB_TOKEN: ${{ inputs.job_token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, glob, time, urllib.error, urllib.request
          ctx = json.load(open("/tmp/ctx.json"))
          files = glob.glob("/tmp/source.*")
          size = os.path.getsize(files[0]) if files else None
          base = os.environ["API_BASE"].rstrip("/")
          body = json.dumps({
              "status": "completed",
              "object_key": ctx.get("object_key"),
              "size_bytes": size,
          }).encode()
          # UA eksplisit: Cloudflare menolak "Python-urllib/3.x" (error 1010/403).
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "X-Clipzi-Job-Token": os.environ["JOB_TOKEN"],
              "User-Agent": "ClipziAI-Downloader/1.0",
          }
          last_error = ""
          for attempt in range(1, 4):
              req = urllib.request.Request(
                  base + "/api/internal/downloader/callback",
                  data=body,
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      print(resp.read().decode()[:500])
                  break
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", "replace").strip()[:300]
                  last_error = f"HTTP {exc.code}: {detail}"
              except (urllib.error.URLError, TimeoutError) as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
              if attempt < 3:
                  print(f"callback percobaan {attempt} gagal ({last_error}), ulangi...", flush=True)
                  time.sleep(5 * attempt)
          else:
              raise SystemExit(f"Callback sukses gagal -> {last_error}")
          PY

      - name: Callback gagal
        if: failure()
        env:
          JOB_TOKEN: ${{ inputs.job_token }}
          CTX_OUTCOME: ${{ steps.ctx.outcome }}
          DL_OUTCOME: ${{ steps.download.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          base = os.environ.get("API_BASE", "").rstrip("/")
          if not base:
              raise SystemExit(0)
          body = json.dumps({
              "status": "failed",
              "error": (
                  "downloader workflow gagal: "
                  f"context={os.environ.get('CTX_OUTCOME') or '-'} "
                  f"download={os.environ.get('DL_OUTCOME') or '-'} "
                  f"upload={os.environ.get('UPLOAD_OUTCOME') or '-'}"
                  " (lihat log job GitHub Actions)"
              ),
              "error_category": "unknown",
          }).encode()
          # UA eksplisit: Cloudflare menolak "Python-urllib/3.x" (error 1010/403).
          headers = {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "X-Clipzi-Job-Token": os.environ["JOB_TOKEN"],
              "User-Agent": "ClipziAI-Downloader/1.0",
          }
          req = urllib.request.Request(
              base + "/api/internal/downloader/callback",
              data=body,
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(resp.read().decode()[:300])
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", "replace").strip()[:300]
              print("callback gagal:", exc.code, detail)
          except Exception as exc:
              print("callback gagal:", exc)
          PY

      - name: Bersihkan file sensitif
        if: always()
        run: |
          rm -f /tmp/cookies.txt /tmp/ctx.json /tmp/source.* /tmp/upload_path.txt /tmp/upload_url.txt /tmp/upload_resp.txt

