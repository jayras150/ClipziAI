name: Build and Push Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/docker-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight (syntax backend)
        run: |
          python -m compileall -q backend/app

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Worker = image PENUH (Whisper CTranslate2 + lib CUDA) untuk Vast.ai.
      # HANYA tag `:worker`: tag duplikat (:1.5.0, :latest) membuat web Vast dan
      # Docker Hub membingungkan (dulu :latest malah menunjuk image 3,8 GB ini)
      # dan menambah manifest yang harus di-push setiap build.
      - name: Build and Push (worker, GPU)
        id: worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          platforms: linux/amd64
          # Cache layer antar-build: tanpa ini seluruh dependency + model Whisper
          # (±1,6 GB) diunduh ulang setiap push sehingga build 7-10 menit.
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker
          # Model Whisper dibekukan di image (turbo ±1.6 GB) -> worker tidak
          # mengunduh model saat start; build lebih lama, runtime lebih andal.
          build-args: |
            WHISPER_MODEL_REPO=deepdml/faster-whisper-large-v3-turbo-ct2
          tags: |
            sujinwo555/clipzi-backend:worker

      # API = image untuk container di VPS (tanpa CUDA, dengan Whisper CPU kecil).
      # Render video berat tetap hanya di worker Vast.ai.
      # `:latest` sengaja di sini (image 700 MB), bukan di worker, supaya
      # `docker pull :latest` tidak pernah menarik image 3,8 GB.
      - name: Build and Push (api)
        id: api
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          tags: |
            sujinwo555/clipzi-backend:api
            sujinwo555/clipzi-backend:latest

      # Digest dipakai untuk pin `image@sha256:...` — node Vast bisa menyimpan
      # cache tag `:worker` lama, sedangkan digest selalu menunjuk build ini.
      - name: Ringkasan digest image
        run: |
          echo "worker : sujinwo555/clipzi-backend@${{ steps.worker.outputs.digest }}"
          echo "api    : sujinwo555/clipzi-backend@${{ steps.api.outputs.digest }}"
          {
            echo "## Digest image"
            echo ""
            echo "| target | image |"
            echo "| --- | --- |"
            echo "| worker (Vast) | \`sujinwo555/clipzi-backend@${{ steps.worker.outputs.digest }}\` |"
            echo "| api (VPS) | \`sujinwo555/clipzi-backend@${{ steps.api.outputs.digest }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
