name: Build and Push Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/docker-backend.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # BUILD WORKER (GPU)
      # ==========================================

      - name: Build and Push Worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          platforms: linux/amd64

          tags: |
            sujinwo555/clipzi-backend:worker
            sujinwo555/clipzi-backend:1.5.0
            sujinwo555/clipzi-backend:latest

          cache-from: type=gha,scope=backend-worker
          cache-to: type=gha,scope=backend-worker,mode=max

      # ==========================================
      # BUILD API (CPU)
      # ==========================================

      - name: Build and Push API
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: api
          push: true
          platforms: linux/amd64

          tags: |
            sujinwo555/clipzi-backend:api

          cache-from: type=gha,scope=backend-api
          cache-to: type=gha,scope=backend-api,mode=max
