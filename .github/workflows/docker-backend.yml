name: Build and Push Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/docker-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Worker = image PENUH (Whisper CTranslate2 + lib CUDA) untuk Vast.ai.
      # Tag :worker dipakai VAST_WORKER_IMAGE; :1.5.0/:latest dipertahankan
      # supaya deployment lama tetap kompatibel.
      - name: Build and Push (worker, GPU)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          platforms: linux/amd64
          tags: |
            sujinwo555/clipzi-backend:worker
            sujinwo555/clipzi-backend:1.5.0
            sujinwo555/clipzi-backend:latest

      # API = image LEAN (tanpa CUDA/Whisper) untuk container di VPS.
      # Beban berat (ffmpeg render + transkripsi) tidak pernah jalan di VPS.
      - name: Build and Push (api, lean)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          tags: |
            sujinwo555/clipzi-backend:api
