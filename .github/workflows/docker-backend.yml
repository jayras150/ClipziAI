name: Build and Push Backend

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/docker-backend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preflight (syntax backend)
        run: |
          python -m compileall -q backend/app

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Worker = image PENUH (Whisper CTranslate2 + lib CUDA) untuk Vast.ai.
      # Tag :worker dipakai VAST_WORKER_IMAGE; :1.5.0/:latest dipertahankan
      # supaya deployment lama tetap kompatibel.
      - name: Build and Push (worker, GPU)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: worker
          push: true
          platforms: linux/amd64
          # Model Whisper dibekukan di image (turbo ±1.6 GB) -> worker tidak
          # mengunduh model saat start; build lebih lama, runtime lebih andal.
          build-args: |
            WHISPER_MODEL_REPO=deepdml/faster-whisper-large-v3-turbo-ct2
          tags: |
            sujinwo555/clipzi-backend:worker
            sujinwo555/clipzi-backend:1.5.0
            sujinwo555/clipzi-backend:latest

      # API = image untuk container di VPS (tanpa CUDA, dengan Whisper CPU kecil).
      # Render video berat tetap hanya di worker Vast.ai.
      - name: Build and Push (api)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: api
          push: true
          platforms: linux/amd64
          tags: |
            sujinwo555/clipzi-backend:api
